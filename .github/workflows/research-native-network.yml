name: research-native-network
# One-off: how the Mendix 10.24 native client talks to the runtime (request/response format), for a client-side cache.
on:
  push:
    branches: [research/native-network]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: MxBuild
        run: bash scripts/get-mxbuild.sh 10.24.13 "$HOME/mxb" | tail -1
      - name: post() and fetch use
        run: |
          D="$HOME/mxb/10.24.13/modeler/tools/node/node_modules/mendix"
          for spec in 'CXHbUHY8.js|fetch(' 'CXHbUHY8.js|function registerMiddleware' 'CXHbUHY8.js|async function post' 'CXHbUHY8.js|function post' 'DWZCwGED.js|fetch(' 'BYtvtliW.js|operationId'; do
            f="$D/${spec%%|*}"; pat="${spec#*|}"
            echo "################ $pat in ${spec%%|*} (count: $(grep -oF -- "$pat" "$f" | wc -l))"
            python3 - "$f" "$pat" <<'PY'
          import sys
          s=open(sys.argv[1],encoding="utf-8",errors="replace").read(); p=sys.argv[2]; i=0; n=0
          while n<2:
              i=s.find(p,i)
              if i<0: break
              print("---", i); print(s[max(0,i-1500):i+1500]); i+=len(p); n+=1
          PY
          done
