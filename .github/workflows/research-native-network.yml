name: research-native-network
# One-off: how the Mendix 10.24 native client talks to the runtime (request/response format), for a client-side cache.
on:
  push:
    branches: [research/native-network]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: MxBuild
        run: bash scripts/get-mxbuild.sh 10.24.13 "$HOME/mxb" | tail -1
      - name: instructions and results
        run: |
          D="$HOME/mxb/10.24.13/modeler/tools/node/node_modules/mendix"
          echo "== instruction type names (case\"...\" near instruction):"
          cat "$D"/*.js | grep -oE 'instruction\.type[^;]{0,40}|case"[a-z_]+":' | sort | uniq -c | sort -rn | head -60
          for spec in 'BHFJV1aT.js|getGuidsPushedToClient' 'BHFJV1aT.js|actionResult' 'CoKaOcah.js|instructions' 'BHFJV1aT.js|executeMicroflow'; do
            f="$D/${spec%%|*}"; pat="${spec#*|}"
            echo "################ $pat in ${spec%%|*} (count: $(grep -oF -- "$pat" "$f" | wc -l))"
            python3 - "$f" "$pat" <<'PY'
          import sys
          s=open(sys.argv[1],encoding="utf-8",errors="replace").read(); p=sys.argv[2]; i=0; n=0
          while n<2:
              i=s.find(p,i)
              if i<0: break
              print("---", i); print(s[max(0,i-600):i+1400]); i+=len(p); n+=1
          PY
          done
          echo "== files defining getGuidsPushedToClient"; grep -lF 'function getGuidsPushedToClient' "$D"/*.js
          f=$(grep -lF 'function getGuidsPushedToClient' "$D"/*.js | head -1)
          [ -n "$f" ] && python3 - "$f" 'function getGuidsPushedToClient' <<'PY'
          import sys
          s=open(sys.argv[1],encoding="utf-8",errors="replace").read(); p=sys.argv[2]; i=s.find(p)
          print(s[max(0,i-200):i+900])
          PY
