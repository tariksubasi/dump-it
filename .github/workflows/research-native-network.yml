name: research-native-network
# One-off: how the Mendix 10.24 native client talks to the runtime (request/response format), for a client-side cache.
on:
  push:
    branches: [research/native-network]
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: MxBuild
        run: bash scripts/get-mxbuild.sh 10.24.13 "$HOME/mxb" | tail -1
      - name: Scan the mendix client package
        run: |
          D="$HOME/mxb/10.24.13/modeler/tools/node/node_modules/mendix"
          echo "== files: $(ls "$D" | wc -l)"
          for pat in 'xas/' 'runtimeOperation' 'operationId' 'executeaction' 'retrieve_by_xpath' 'X-Csrf-Token' 'XMLHttpRequest' 'fetch(' 'keepalive' 'instructions' 'sessionObjectId' 'application/json'; do
            echo "################ $pat"
            grep -lF -- "$pat" "$D"/*.js 2>/dev/null | head -5 | while read f; do echo "  $(basename "$f") $(grep -oF -- "$pat" "$f" | wc -l)"; done
          done
          for pat in 'xas/' 'runtimeOperation' 'X-Csrf-Token' 'instructions' 'keepalive'; do
            f=$(grep -lF -- "$pat" "$D"/*.js 2>/dev/null | head -1)
            [ -z "$f" ] && continue
            echo "################ SNIPPET $pat in $(basename "$f")"
            python3 - "$f" "$pat" <<'PY'
          import sys
          s=open(sys.argv[1],encoding="utf-8",errors="replace").read(); p=sys.argv[2]; i=0; n=0
          while n<2:
              i=s.find(p,i)
              if i<0: break
              print("---", i); print(s[max(0,i-900):i+1100]); i+=len(p); n+=1
          PY
          done
